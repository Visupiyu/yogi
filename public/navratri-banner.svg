<svg width="600" height="500" viewBox="0 0 600 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Navratri festive diya and dandiya illustration">
  <defs>
    <radialGradient id="navGlow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#F97316" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="1" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="diyaBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <!-- soft festive glow behind everything -->
  <ellipse cx="300" cy="260" rx="220" ry="200" fill="url(#navGlow)"/>

  <!-- marigold garland arc -->
  <g opacity="0.9">
    <circle cx="150" cy="90" r="12" fill="#FBBF24"/>
    <circle cx="195" cy="70" r="12" fill="#F97316"/>
    <circle cx="245" cy="58" r="12" fill="#FBBF24"/>
    <circle cx="300" cy="52" r="12" fill="#F97316"/>
    <circle cx="355" cy="58" r="12" fill="#FBBF24"/>
    <circle cx="405" cy="70" r="12" fill="#F97316"/>
    <circle cx="450" cy="90" r="12" fill="#FBBF24"/>
  </g>

  <!-- crossed dandiya sticks -->
  <g stroke-linecap="round">
    <rect x="296" y="160" width="10" height="230" rx="5" fill="#B45309" transform="rotate(28 300 275)"/>
    <rect x="296" y="160" width="10" height="230" rx="5" fill="#DC2626" transform="rotate(-28 300 275)"/>
    <rect x="286" y="185" width="30" height="10" rx="5" fill="#FBBF24" transform="rotate(28 300 190)"/>
    <rect x="286" y="185" width="30" height="10" rx="5" fill="#FBBF24" transform="rotate(-28 300 190)"/>
  </g>

  <!-- diya lamp -->
  <g transform="translate(220,300)">
    <path d="M0 40 Q0 90 80 90 Q160 90 160 40 Q160 20 80 20 Q0 20 0 40 Z" fill="url(#diyaBody)"/>
    <ellipse cx="80" cy="38" rx="80" ry="16" fill="#FCD34D"/>
    <ellipse cx="80" cy="38" rx="55" ry="9" fill="#7C2D12"/>
    <path d="M75 -10 C60 10 65 28 80 34 C95 28 100 10 85 -10 C82 -4 78 -4 75 -10 Z" fill="url(#flame)"/>
    <circle cx="20" cy="45" r="4" fill="#DC2626"/>
    <circle cx="140" cy="45" r="4" fill="#DC2626"/>
    <circle cx="80" cy="55" r="4" fill="#DC2626"/>
  </g>

  <!-- rangoli accent dots, kept minimal -->
  <g opacity="0.8">
    <circle cx="90" cy="420" r="6" fill="#DC2626"/>
    <circle cx="115" cy="440" r="5" fill="#F97316"/>
    <circle cx="70" cy="445" r="4" fill="#FBBF24"/>
    <circle cx="500" cy="420" r="6" fill="#DC2626"/>
    <circle cx="475" cy="440" r="5" fill="#F97316"/>
    <circle cx="520" cy="445" r="4" fill="#FBBF24"/>
  </g>
</svg>
