<svg width="800" height="520" viewBox="0 0 800 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Laptop, smartphone, headphones and smartwatch illustration">
  <!-- Neutral YOMICO electronics artwork: no text, prices, discounts or promises.
       Transparent background — it sits on the PromoBanner gradient. -->
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#134E4A"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D9488"/>
      <stop offset="0.6" stop-color="#0E7490"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>

  <!-- soft platform -->
  <ellipse cx="400" cy="462" rx="330" ry="30" fill="#FFFFFF" opacity="0.18"/>
  <ellipse cx="400" cy="462" rx="250" ry="18" fill="#FFFFFF" opacity="0.22"/>

  <!-- laptop -->
  <rect x="210" y="130" width="380" height="240" rx="16" fill="url(#body)"/>
  <rect x="226" y="146" width="348" height="208" rx="8" fill="url(#screen)"/>
  <rect x="226" y="146" width="348" height="208" rx="8" fill="url(#screenGlow)" opacity="0.55"/>
  <circle cx="330" cy="236" r="46" fill="#FFFFFF" opacity="0.10"/>
  <circle cx="470" cy="276" r="64" fill="#FBBF24" opacity="0.14"/>
  <path d="M170 372 H630 L660 408 Q662 416 652 416 H148 Q138 416 140 408 Z" fill="url(#body)"/>
  <rect x="360" y="380" width="80" height="8" rx="4" fill="#94A3B8"/>

  <!-- smartphone (left) -->
  <g transform="translate(96 186) rotate(-8)">
    <rect x="0" y="0" width="112" height="224" rx="20" fill="#1E293B"/>
    <rect x="8" y="10" width="96" height="204" rx="14" fill="url(#screenGlow)"/>
    <rect x="40" y="16" width="32" height="6" rx="3" fill="#1E293B"/>
    <circle cx="56" cy="120" r="26" fill="#FFFFFF" opacity="0.16"/>
  </g>

  <!-- headphones (right) -->
  <g transform="translate(600 206)">
    <path d="M18 120 V92 C18 38 58 0 104 0 C150 0 190 38 190 92 V120" stroke="#1E293B" stroke-width="16" stroke-linecap="round" fill="none"/>
    <rect x="0" y="104" width="52" height="92" rx="22" fill="#F97316"/>
    <rect x="156" y="104" width="52" height="92" rx="22" fill="#F97316"/>
    <rect x="10" y="118" width="32" height="64" rx="14" fill="#1E293B" opacity="0.25"/>
    <rect x="166" y="118" width="32" height="64" rx="14" fill="#1E293B" opacity="0.25"/>
  </g>

  <!-- smartwatch (front) -->
  <g transform="translate(212 330)">
    <rect x="22" y="-26" width="44" height="36" rx="8" fill="#334155"/>
    <rect x="22" y="94" width="44" height="36" rx="8" fill="#334155"/>
    <rect x="0" y="0" width="88" height="104" rx="22" fill="#1E293B"/>
    <rect x="8" y="8" width="72" height="88" rx="16" fill="url(#screen)"/>
    <circle cx="44" cy="52" r="24" stroke="#0D9488" stroke-width="6" fill="none"/>
    <path d="M44 52 L44 36 M44 52 L56 60" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- sparkles -->
  <circle cx="160" cy="120" r="6" fill="#FBBF24" opacity="0.9"/>
  <circle cx="660" cy="150" r="5" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="720" cy="96" r="8" fill="#0D9488" opacity="0.7"/>
  <circle cx="110" cy="430" r="5" fill="#FFFFFF" opacity="0.7"/>
</svg>
