<svg width="1600" height="600" viewBox="0 0 1600 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="YOMICO online marketplace illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4FBFA"/>
      <stop offset="0.55" stop-color="#F4FBFA"/>
      <stop offset="1" stop-color="#FDF3E9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0D9488" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0D9488" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="600" fill="url(#bg)"/>

  <!-- soft depth blob behind the illustration -->
  <circle cx="1180" cy="300" r="260" fill="url(#glow)"/>

  <!-- scattered lifestyle dots (kept minimal) -->
  <circle cx="980" cy="120" r="8" fill="#F97316" opacity="0.35"/>
  <circle cx="1420" cy="160" r="6" fill="#0D9488" opacity="0.3"/>
  <circle cx="1080" cy="470" r="7" fill="#FBBF24" opacity="0.35"/>
  <circle cx="1360" cy="460" r="5" fill="#0D9488" opacity="0.25"/>

  <!-- shopping bag -->
  <g transform="translate(1050,170)">
    <path d="M20 60 L280 60 L300 340 Q300 360 280 360 L20 360 Q0 360 0 340 L20 60 Z" fill="#0D9488"/>
    <path d="M70 60 C70 10 110 -20 150 -20 C190 -20 230 10 230 60" stroke="#0F766E" stroke-width="16" fill="none" stroke-linecap="round"/>
    <rect x="0" y="150" width="300" height="14" fill="#F4FBFA" opacity="0.5"/>
  </g>

  <!-- sale tag -->
  <g transform="translate(1300,300) rotate(18)">
    <rect x="0" y="0" width="90" height="90" rx="16" fill="#F97316"/>
    <circle cx="45" cy="45" r="24" fill="#FDF3E9"/>
    <text x="45" y="53" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#F97316" text-anchor="middle">%</text>
  </g>

  <!-- small gift box -->
  <g transform="translate(1220,420)">
    <rect x="0" y="20" width="80" height="60" rx="6" fill="#FBBF24"/>
    <rect x="0" y="20" width="80" height="16" fill="#F59E0B"/>
    <rect x="34" y="0" width="12" height="80" fill="#F59E0B"/>
  </g>

  <!-- storefront strip at base, subtle -->
  <g opacity="0.18">
    <rect x="0" y="560" width="1600" height="40" fill="#0D9488"/>
    <rect x="0" y="560" width="80" height="40" fill="#F4FBFA"/>
    <rect x="160" y="560" width="80" height="40" fill="#F4FBFA"/>
    <rect x="320" y="560" width="80" height="40" fill="#F4FBFA"/>
    <rect x="480" y="560" width="80" height="40" fill="#F4FBFA"/>
    <rect x="640" y="560" width="80" height="40" fill="#F4FBFA"/>
    <rect x="800" y="560" width="80" height="40" fill="#F4FBFA"/>
    <rect x="960" y="560" width="80" height="40" fill="#F4FBFA"/>
    <rect x="1120" y="560" width="80" height="40" fill="#F4FBFA"/>
    <rect x="1280" y="560" width="80" height="40" fill="#F4FBFA"/>
    <rect x="1440" y="560" width="80" height="40" fill="#F4FBFA"/>
  </g>
</svg>
