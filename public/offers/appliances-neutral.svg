<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Home and kitchen appliances illustration">
  <!-- Neutral YOMICO appliances artwork: no text, prices, discounts or promises.
       The OfferCards card draws its own title over the left side, so the
       artwork is kept to the right half. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E2E8F0"/>
      <stop offset="0.55" stop-color="#F1F5F9"/>
      <stop offset="1" stop-color="#FDF3E9"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E2E8F0"/>
      <stop offset="0.5" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0D9488" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0D9488" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>
  <circle cx="880" cy="300" r="300" fill="url(#glow)"/>
  <rect x="0" y="540" width="1200" height="60" fill="#0F172A" opacity="0.9"/>

  <!-- refrigerator -->
  <g transform="translate(640 110)">
    <rect x="0" y="0" width="190" height="430" rx="14" fill="url(#steel)" stroke="#94A3B8" stroke-width="3"/>
    <line x1="0" y1="150" x2="190" y2="150" stroke="#94A3B8" stroke-width="3"/>
    <rect x="160" y="40" width="10" height="70" rx="5" fill="#64748B"/>
    <rect x="160" y="190" width="10" height="110" rx="5" fill="#64748B"/>
    <rect x="30" y="40" width="70" height="50" rx="6" fill="#0D9488" opacity="0.18"/>
  </g>

  <!-- washing machine -->
  <g transform="translate(860 300)">
    <rect x="0" y="0" width="200" height="240" rx="16" fill="#F8FAFC" stroke="#94A3B8" stroke-width="3"/>
    <rect x="0" y="0" width="200" height="46" rx="16" fill="#E2E8F0"/>
    <circle cx="36" cy="23" r="9" fill="#F97316"/>
    <rect x="120" y="16" width="60" height="14" rx="7" fill="#94A3B8"/>
    <circle cx="100" cy="146" r="72" fill="#CBD5E1"/>
    <circle cx="100" cy="146" r="56" fill="#0D9488" opacity="0.35"/>
    <path d="M60 160 Q100 120 140 160" stroke="#FFFFFF" stroke-width="6" fill="none" opacity="0.7"/>
  </g>

  <!-- microwave on the counter -->
  <g transform="translate(860 190)">
    <rect x="0" y="0" width="230" height="110" rx="12" fill="#1E293B"/>
    <rect x="14" y="14" width="150" height="82" rx="8" fill="#334155"/>
    <rect x="22" y="22" width="134" height="66" rx="6" fill="#FBBF24" opacity="0.28"/>
    <rect x="176" y="18" width="40" height="22" rx="4" fill="#0D9488"/>
    <circle cx="186" cy="62" r="6" fill="#94A3B8"/>
    <circle cx="206" cy="62" r="6" fill="#94A3B8"/>
    <circle cx="196" cy="84" r="6" fill="#94A3B8"/>
  </g>

  <!-- kettle -->
  <g transform="translate(1082 414)">
    <path d="M10 120 L22 30 H78 L90 120 Z" fill="#F97316"/>
    <path d="M30 30 Q50 0 70 30" stroke="#1E293B" stroke-width="8" fill="none"/>
    <path d="M90 60 Q118 60 104 96" stroke="#1E293B" stroke-width="8" fill="none" stroke-linecap="round"/>
    <rect x="0" y="116" width="100" height="10" rx="5" fill="#1E293B"/>
  </g>

  <!-- mixer on the floor line -->
  <g transform="translate(560 400)">
    <rect x="10" y="110" width="70" height="30" rx="8" fill="#1E293B"/>
    <path d="M20 110 L28 30 H62 L70 110 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="3"/>
    <rect x="24" y="16" width="42" height="16" rx="6" fill="#0D9488"/>
  </g>
</svg>
